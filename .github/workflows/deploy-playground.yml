# Build the playground with Vite and publish it to GitHub Pages, by pushing
# the build to the `gh-pages` branch (which GitHub serves at
# https://<owner>.github.io/<repo>). Publishing from a branch needs no Pages
# settings, unlike the Actions-based deployment, which the workflow token
# isn't allowed to enable for this repository.
name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Allow only one concurrent deployment, but let in-progress runs finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build playground
        # A relative base keeps the build independent of the repository name,
        # so it works wherever GitHub serves it (https://<owner>.github.io/<repo>).
        run: pnpm exec vite build playground --base ./
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playground/dist
          force_orphan: true
